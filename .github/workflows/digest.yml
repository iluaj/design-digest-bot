# Запуск бота в облаке: компьютер владельца не нужен.
#
# Что настроить один раз:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     BOT_TOKEN — токен от @BotFather
#     CHAT_ID   — кому слать (узнаётся командой: python run.py whoami)
#
# Состояние между запусками хранится в data/seen.txt — это отпечатки уже
# отправленных работ. Текстовый файл, git дописывает его построчно.
# Саму базу SQLite в репозиторий не кладём: она весит мегабайты.

name: Дайджест

on:
  schedule:
    - cron: "0 15 * * *"      # 15:00 UTC = 18:00 по Москве
  workflow_dispatch:           # кнопка «Run workflow» на вкладке Actions

permissions:
  contents: write              # чтобы сохранять состояние обратно в репозиторий

concurrency:
  group: digest                # два запуска разом подрались бы за состояние
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # обход трёхсот с лишним источников небыстрый

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Восстановить состояние
        run: python run.py import-state

      - name: Обойти источники
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python run.py collect

      - name: Отправить дайджест
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python run.py digest

      - name: Сохранить состояние
        if: success()
        run: |
          python run.py export-state
          git config user.name  "design-digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/seen.txt data/seeded.txt
          if git diff --staged --quiet; then
            echo "состояние не изменилось"
          else
            git commit -m "состояние: $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Логи при сбое
        if: failure()
        run: tail -100 logs/bot.log || true
