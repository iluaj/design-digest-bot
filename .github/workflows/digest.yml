# Переезд в облако: работает без твоего компа.
# Нужно: приватный репозиторий + секреты BOT_TOKEN и CHAT_ID в
# Settings -> Secrets and variables -> Actions.
name: design digest

on:
  schedule:
    - cron: "0 15 * * *"     # 15:00 UTC = 18:00 МСК
  workflow_dispatch:          # кнопка "запустить вручную"

permissions:
  contents: write             # чтобы коммитить базу обратно

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Собрать и отправить
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python run.py collect
          python run.py digest

      - name: Запомнить, что уже отправлено
        run: |
          git config user.name  "design-digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/state.db
          git diff --staged --quiet || git commit -m "state: $(date -u +%F)"
          git push
