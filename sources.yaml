# ============================================================
#  Источники дайджеста. Правится руками, код трогать не надо.
#  enabled: false — временно отключить источник.
#  Порядок групп = порядок разделов в дайджесте.
#  Проверить один:  .venv/bin/python run.py test <id>
#  Проверить все:   .venv/bin/python run.py check
# ============================================================

settings:
  timezone: Europe/Moscow
  digest_time: "18:00"
  collect_every_hours: 3
  max_items_per_source: 8
  digest_max_items: 120
  max_per_source_in_digest: 4
  send_empty_digest: false
  pause_between_sources: 2

groups:
  ui_product:    "🖥 Интерфейсы и продуктовый дизайн"
  ui_craft:      "⚙️ Вёрстка, доступность, дизайн-системы"
  ui_galleries:  "🗂 Галереи интерфейсов"
  studios:       "🎨 Студии и агентства"
  media:         "📰 Издания и блоги"
  telegram:      "✈️ Telegram-каналы"
  youtube:       "▶️ YouTube"

