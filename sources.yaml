# ============================================================
#  Источники дайджеста — ТОЛЬКО КЕЙСЫ И ПРОЕКТЫ.
#
#  Сюда попадает то, что публикует работы: портфолио студий,
#  галереи проектов, издания с разборами кейсов.
#  Статьи, заметки, доклады и мемы сюда не берём — они лежат
#  в sources_extra.yaml и ботом не читаются.
#
#  Ядро — каталог студий d1s1.com (это же источник, по которому
#  они собирают свой ежедневный дайджест).
#
#  Проверить один:  .venv/bin/python run.py test <id>
#  Проверить все:   .venv/bin/python run.py check
# ============================================================

settings:
  timezone: Europe/Moscow
  digest_time: "18:00"
  collect_every_hours: 6
  max_items_per_source: 5
  digest_max_items: 80
  max_per_source_in_digest: 3
  send_empty_digest: false
  pause_between_sources: 1

groups:
  ui_galleries:  "🖥 Интерфейсы и сайты"
  studios:       "🎨 Кейсы студий"
  cases_media:   "📐 Разборы кейсов"
  telegram:      "✈️ Telegram"

sources:

